# YSKAR (YSR) fuer HiveOS. Der offizielle CLI-Miner (miner/) mit yskar-cuda
# (NVIDIA) und yskar-opencl (AMD, Intel),
# je Grafikkarte ein Prozess. Gebaut von hiveos/bauen.sh.
#
# Der Name muss zum Archiv passen: yskar-hiveos-<version>.tar.gz. HiveOS
# nimmt den Teil vor dem letzten Bindestrich als Namen des Miners.
CUSTOM_NAME=yskar-hiveos
CUSTOM_VERSION=0.0.0
CUSTOM_LOG_BASENAME=/var/log/miner/custom/yskar-hiveos
CUSTOM_CONFIG_FILENAME=/hive/miners/custom/yskar-hiveos/yskar.conf
