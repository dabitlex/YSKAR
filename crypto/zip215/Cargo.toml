[package]
name = "yskar-zip215"
version = "1.0.0"
edition = "2021"
publish = false
description = "Ed25519-Pruefung nach Abschnitt 7.8 fuer YSKAR (Konsensfassung 6), als WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# Quelloffene Rust-Bibliothek, die genau die Regel aus Abschnitt 7.8 umsetzt.
# Exakte Version: Ein Update ist eine Konsensentscheidung und wird gegen alle
# Testvektoren geprueft (tests/zip215.test.ts), nicht automatisch uebernommen.
ed25519-zebra = { version = "=5.0.0", default-features = false, features = ["alloc"] }
rand_chacha = { version = "=0.10.0", default-features = false }
rand_core = { version = "=0.10.1", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true
