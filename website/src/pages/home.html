<div class="page" data-page="home">

  <section class="opening" id="opening">
    <div class="stage" id="stage">
      <div class="stage__inner">
        <img class="stage__photo" data-img="fjord-night" data-orient data-ta="alt:home.hero.alt" alt="" fetchpriority="high">
        <canvas class="stage__sky" id="sky" aria-hidden="true"></canvas>
        <div class="stage__lights" id="lights" aria-hidden="true"></div>
      </div>
      <div class="stage__shade" aria-hidden="true"></div>
      <div class="stage__scrim" aria-hidden="true"></div>
    </div>

    <div class="hero">
      <div class="wrap hero__in">
        <h1 class="hero__title t-mega" data-t="home.hero.h1"></h1>
        <div class="hero__side">
          <p class="hero__lead lead" data-t="home.hero.lead"></p>
          <div class="row hero__cta">
            <a class="btn" href="#start" data-t="cta.join"></a>
            <a class="more" href="#home-chain" data-t="home.hero.cta2"></a>
          </div>
        </div>
      </div>
      <p class="hero__note wrap"><span class="hero__note-in"><span class="tick__dot" aria-hidden="true"></span><span data-live="heroLine"></span></span></p>
    </div>

    <div class="manifesto wrap">
      <p class="manifesto__p t-l lit" data-lit data-t="home.m1"></p>
      <p class="manifesto__p t-l lit" data-lit data-t="home.m2"></p>
      <p class="manifesto__p t-l lit" data-lit data-t="home.m3"></p>
    </div>
  </section>

  <section class="chainwalk" id="chain">
    <div class="chainwalk__sticky">
      <canvas id="walk" data-ta="aria-label:walk.canvas" role="img"></canvas>
      <div class="chainwalk__hud wrap" aria-hidden="true">
        <p class="chainwalk__h mono" id="walk-h"></p>
        <p class="chainwalk__d" id="walk-d"></p>
        <p class="chainwalk__legend">
          <span><i class="dot dot--cool"></i><span data-t="walk.legend.block"></span></span>
          <span><i class="dot dot--warm"></i><span data-t="walk.legend.tx"></span></span>
        </p>
      </div>
      <div class="walk-caps wrap">
        <div class="walk-cap walk-cap--start" data-at="start">
          <h2 class="t-xl" data-t="walk.start.h"></h2>
          <p class="lead" data-t="walk.start.p"></p>
        </div>
        <div class="walk-cap" data-at="0">
          <p class="walk-cap__k mono" data-k="block"></p>
          <h3 class="t-l" data-t="walk.c0.h"></h3>
          <p class="lead" data-t="walk.c0.p"></p>
          <a class="more" data-open href="#explorer-block-0" data-t="walk.open"></a>
        </div>
        <div class="walk-cap" data-at="46">
          <p class="walk-cap__k mono" data-k="block"></p>
          <h3 class="t-l" data-t="walk.c1.h"></h3>
          <p class="lead" data-t="walk.c1.p"></p>
        </div>
        <div class="walk-cap" data-at="3974">
          <p class="walk-cap__k mono" data-k="block"></p>
          <h3 class="t-l" data-t="walk.c3.h"></h3>
          <p class="lead" data-t="walk.c3.p"></p>
          <a class="more" data-open href="#explorer-block-3974" data-t="walk.open"></a>
        </div>
        <div class="walk-cap" data-at="date:2026-10-25T12:00:00Z">
          <p class="walk-cap__k mono" data-k="date"></p>
          <h3 class="t-l" data-t="walk.c4.h"></h3>
          <p class="lead" data-t="walk.c4.p"></p>
        </div>
        <div class="walk-cap walk-cap--now" data-at="now">
          <p class="walk-cap__k mono" data-k="now"></p>
          <h3 class="t-l" data-t="walk.c5.h"></h3>
          <p class="lead" data-t="walk.c5.p"></p>
          <a class="btn" href="#start" data-t="cta.join"></a>
        </div>
        <div class="walk-cap" data-at="10000">
          <p class="walk-cap__k mono" data-k="future" data-when="future"></p>
          <p class="walk-cap__k mono" data-k="block" data-when="past" hidden></p>
          <h3 class="t-l" data-when="future" data-t="walk.c6.h"></h3>
          <p class="lead" data-when="future" data-t="walk.c6.p"></p>
          <h3 class="t-l" data-when="past" data-t="walk.c6.h.past" hidden></h3>
          <p class="lead" data-when="past" data-t="walk.c6.p.past" hidden></p>
        </div>
        <div class="walk-cap" data-at="12000">
          <p class="walk-cap__k mono" data-k="future" data-when="future"></p>
          <p class="walk-cap__k mono" data-k="block" data-when="past" hidden></p>
          <h3 class="t-l" data-when="future" data-t="walk.c7.h"></h3>
          <p class="lead" data-when="future" data-t="walk.c7.p"></p>
          <h3 class="t-l" data-when="past" data-t="walk.c7.h.past" hidden></h3>
          <p class="lead" data-when="past" data-t="walk.c7.p.past" hidden></p>
        </div>
      </div>
      <div class="walk-tip" id="walk-tip" hidden>
        <p class="walk-tip__h mono" data-f="h"></p>
        <p data-f="t"></p>
        <p class="faint" data-f="who"></p>
        <a href="#explorer" data-t="walk.open"></a>
      </div>
    </div>
  </section>

  <section class="sec verify" id="proof">
    <div class="wrap verify__in">
      <div class="verify__say">
        <h2 class="t-xl" data-rise data-t="home.proof.h"></h2>
        <p class="lead" data-rise data-delay="90" data-t="home.proof.p"></p>
      </div>
      <div class="prover" id="prover" data-rise data-delay="160">
        <p class="prover__label" data-t="prove.label"></p>
        <p class="prover__hash mono" id="prover-hash" aria-live="off"></p>
        <p class="prover__verdict" id="prover-verdict" role="status"></p>
        <div class="row prover__go">
          <button type="button" class="btn" data-prove="genesis" data-t="prove.btn.genesis"></button>
          <button type="button" class="btn btn--ghost" data-prove="tip" data-t="prove.btn.tip"></button>
        </div>
        <a class="more prover__link" id="prover-link" href="#explorer-block-0" hidden><span></span></a>
        <p class="prover__note micro faint" data-t="prove.note"></p>
      </div>
    </div>
  </section>

  <section class="ways" id="ways">
    <div class="ways__head wrap">
      <div class="ways__say">
        <h2 class="t-xl" data-rise data-t="home.ways.h"></h2>
        <p class="lead" data-rise data-delay="90" data-t="home.ways.p"></p>
      </div>
      <svg class="ymark3" viewBox="187.5 184 879 879" aria-hidden="true" focusable="false" data-rise>
        <defs><linearGradient id="yg3" gradientUnits="userSpaceOnUse" x1="318.6" y1="186.5" x2="819.8" y2="1061"><stop offset="0" stop-color="#63D8FF"/><stop offset=".55" stop-color="#2F7BFF"/><stop offset="1" stop-color="#1B4FD1"/></linearGradient></defs>

      </svg>
    </div>
    <article class="door">
      <div class="door__in">
        <div class="door__media"><img data-img="laptop" data-lazy data-ta="alt:way.mine.alt" alt=""></div>
        <div class="door__txt">
          <p class="door__n" data-t="nav.mine"></p>
          <h3 class="t-l" data-t="way.mine.h"></h3>
          <p class="lead" data-t="way.mine.p"></p>
          <div class="row"><a class="btn" href="#mine" data-t="way.mine.cta"></a></div>
        </div>
      </div>
    </article>
    <article class="door">
      <div class="door__in">
        <div class="door__media"><img data-img="wallet-desk" data-lazy data-ta="alt:way.wallet.alt" alt=""></div>
        <div class="door__txt">
          <p class="door__n" data-t="nav.wallet"></p>
          <h3 class="t-l" data-t="way.wallet.h"></h3>
          <p class="lead" data-t="way.wallet.p"></p>
          <div class="row"><a class="btn" href="#wallet" data-t="way.wallet.cta"></a></div>
        </div>
      </div>
    </article>
    <article class="door">
      <div class="door__in">
        <div class="door__media"><img data-img="node-sill" data-lazy data-ta="alt:way.node.alt" alt=""></div>
        <div class="door__txt">
          <p class="door__n" data-t="nav.node"></p>
          <h3 class="t-l" data-t="way.node.h"></h3>
          <p class="lead" data-t="way.node.p"></p>
          <div class="row"><a class="btn" href="#node" data-t="way.node.cta"></a></div>
        </div>
      </div>
    </article>
    <div class="ways__more wrap">
      <p class="t-m" data-rise data-t="home.ways.more"></p>
      <a class="more" href="#build" data-rise data-delay="90" data-t="home.ways.more.cta"></a>
    </div>
  </section>

  <section class="sec early" id="early">
    <div class="wrap">
      <p class="early__say t-xl lit" data-lit data-say="home.early.say"></p>
      <p class="early__note micro faint" data-t="home.early.note"></p>
      <div class="early__cols">
        <p class="lead" data-rise data-t="home.early.p"></p>
        <div class="era" data-rise data-delay="90">
          <p class="t-s" data-t="home.era.h"></p>
          <div class="era__bar" aria-hidden="true"><i data-era-fill></i></div>
          <p class="era__ends micro"><span data-t="home.era.now"></span><span data-t="home.era.left"></span></p>
          <p class="dim" data-t="home.era.p"></p>
          <a class="more" href="#ysr-halvings" data-t="home.era.cta"></a>
        </div>
      </div>
    </div>
  </section>

  <section class="people" id="people">
    <div class="people__media"><img data-img="lanterns-off" data-orient data-lazy alt=""><img class="people__on" data-img="lanterns" data-orient data-lazy data-ta="alt:home.people.alt" alt=""></div>
    <div class="people__txt wrap">
      <h2 class="t-xl" data-rise data-t="home.people.h"></h2>
      <p class="lead" data-rise data-delay="90" data-t="home.people.p"></p>
      <div class="row" data-rise data-delay="160">
        <a class="btn btn--ghost" href="#community" data-t="home.people.cta"></a>
        <a class="more" href="https://lab.yskar.app" target="_blank" rel="noopener"><span data-t="home.people.cta2"></span><svg class="i-out" aria-hidden="true"><use href="#i-out"/></svg></a>
      </div>
    </div>
  </section>

  <!--@include dawn-scrub-->
</div>
