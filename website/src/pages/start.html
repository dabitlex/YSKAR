<div class="page" data-page="start">
  <section class="pp">
    <div class="wrap pp__in">
      <h1 class="t-xl" data-t="start.h1"></h1>
      <p class="lead" data-t="start.lead"></p>
      <ol class="jump" data-ta="aria-label:start.jump">
        <li><a href="#start-wallet" data-t="start.1.h"></a></li>
        <li><a href="#start-mine" data-t="start.2.h"></a></li>
        <li><a href="#start-node" data-t="start.3.h"></a></li>
        <li><a href="#start-build" data-t="start.4.h"></a></li>
        <li><a href="#start-watch" data-t="start.5.h"></a></li>
      </ol>
    </div>
  </section>
  <section class="ways ways--start" id="ways">
    <article class="door" id="wallet">
      <div class="door__in">
        <div class="door__media"><img data-img="wallet-desk" data-lazy data-ta="alt:way.wallet.alt" alt=""></div>
        <div class="door__txt">
          <p class="door__n" data-t="nav.wallet"></p>
          <h2 class="t-l" data-t="start.1.h"></h2>
          <p class="lead" data-t="start.1.p"></p>
          <div class="row"><a class="btn" href="#wallet" data-t="start.1.do"></a></div>
        </div>
      </div>
    </article>
    <article class="door" id="mine">
      <div class="door__in">
        <div class="door__media"><img data-img="laptop" data-lazy data-ta="alt:way.mine.alt" alt=""></div>
        <div class="door__txt">
          <p class="door__n" data-t="nav.mine"></p>
          <h2 class="t-l" data-t="start.2.h"></h2>
          <p class="lead" data-t="start.2.p"></p>
          <div class="row"><a class="btn" href="#mine" data-t="start.2.do"></a></div>
        </div>
      </div>
    </article>
    <article class="door" id="node">
      <div class="door__in">
        <div class="door__media"><img data-img="node-sill" data-lazy data-ta="alt:way.node.alt" alt=""></div>
        <div class="door__txt">
          <p class="door__n" data-t="nav.node"></p>
          <h2 class="t-l" data-t="start.3.h"></h2>
          <p class="lead" data-t="start.3.p"></p>
          <div class="row"><a class="btn" href="#node" data-t="start.3.do"></a></div>
        </div>
      </div>
    </article>
    <article class="door" id="build">
      <div class="door__in">
        <div class="door__media"><img data-img="lanterns" data-orient data-lazy data-ta="alt:home.people.alt" alt=""></div>
        <div class="door__txt">
          <p class="door__n" data-t="nav.build"></p>
          <h2 class="t-l" data-t="start.4.h"></h2>
          <p class="lead" data-t="start.4.p"></p>
          <div class="row"><a class="btn" href="#build" data-t="start.4.do"></a></div>
        </div>
      </div>
    </article>
    <article class="door" id="watch">
      <div class="door__in">
        <div class="door__media"><img data-img="fjord-night" data-orient data-lazy data-ta="alt:start.alt.fjord" alt=""></div>
        <div class="door__txt">
          <p class="door__n" data-t="nav.network"></p>
          <h2 class="t-l" data-t="start.5.h"></h2>
          <p class="lead" data-t="start.5.p"></p>
          <div class="row"><a class="btn" href="#network" data-t="start.5.do"></a></div>
        </div>
      </div>
    </article>
  </section>
  <section class="band">
    <div class="wrap">
      <div class="band__head"><h2 class="t-l" data-rise data-t="start.safe.h"></h2></div>
      <div class="pts pts--3">
        <div class="pt" data-rise><h3 data-t="com.safe.1.h"></h3><p data-t="com.safe.1.p"></p></div>
        <div class="pt" data-rise data-delay="80"><h3 data-t="com.safe.2.h"></h3><p data-t="com.safe.2.p"></p></div>
        <div class="pt" data-rise data-delay="160"><h3 data-t="com.safe.3.h"></h3><p data-t="com.safe.3.p"></p></div>
      </div>
      <div class="row" style="margin-top:32px" data-rise><a class="more" href="#guides" data-t="start.guides"></a></div>
    </div>
  </section>
  <!--@include dawn-->
</div>
