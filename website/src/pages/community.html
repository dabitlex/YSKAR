<div class="page" data-page="community">
  <section class="ph ph--wide">
    <div class="ph__media" data-lanterns="community"><img data-img="lanterns-off" data-orient alt=""><img class="lanterns__on" data-img="lanterns" data-orient data-ta="alt:home.people.alt" alt="" style="position:absolute;inset:0"></div>
    <div class="ph__txt wrap">
      <h1 class="t-xl" data-t="comm.h1"></h1>
      <p class="lead" data-t="comm.lead"></p>
    </div>
  </section>

  <section class="band" id="now">
    <div class="wrap">
      <p class="say say--wide t-xl lit" data-lit data-say="comm.say"></p>
      <p class="micro faint" style="margin-top:26px;max-width:44em" data-rise data-t="home.early.note"></p>
    </div>
  </section>

  <section class="band" id="channels">
    <div class="wrap duo">
      <div class="duo__a">
        <h2 class="t-l" data-rise data-t="comm.ch.h"></h2>
        <p class="lead" data-rise data-delay="80" data-t="com.ch.p"></p>
      </div>
      <div class="chan" data-rise data-delay="120">
        <a href="https://t.me/yskar_official" target="_blank" rel="noopener"><b data-t="com.channel"></b><small data-t="com.ch.1"></small><svg class="i-out" aria-hidden="true"><use href="#i-out"/></svg></a>
        <a href="https://t.me/+GxAmtTMeG1w1M2Yy" target="_blank" rel="noopener"><b data-t="com.chat"></b><small data-t="com.ch.2"></small><svg class="i-out" aria-hidden="true"><use href="#i-out"/></svg></a>
        <a href="https://x.com/yskar_official" target="_blank" rel="noopener"><b>X</b><small data-t="com.ch.3"></small><svg class="i-out" aria-hidden="true"><use href="#i-out"/></svg></a>
        <a href="https://bitcointalk.org/index.php?topic=5596113.0" target="_blank" rel="noopener"><b data-t="comm.ann"></b><small data-t="com.ch.4"></small><svg class="i-out" aria-hidden="true"><use href="#i-out"/></svg></a>
        <a href="https://github.com/dabitlex/YSKAR" target="_blank" rel="noopener"><b>GitHub</b><small data-t="com.ch.5"></small><svg class="i-out" aria-hidden="true"><use href="#i-out"/></svg></a>
        <a href="https://lab.yskar.app" target="_blank" rel="noopener"><b>YSKAR Lab</b><small data-t="com.ch.6"></small><svg class="i-out" aria-hidden="true"><use href="#i-out"/></svg></a>
      </div>
    </div>
  </section>

  <section class="band" id="vote">
    <div class="wrap">
      <p class="say say--wide t-xl lit" data-lit data-t="comm.vote.say"></p>
      <div class="road" id="road" data-rise>
        <div class="road__bar" aria-hidden="true"><i class="road__fill"></i><b class="road__now"><span class="mono" id="road-now"></span></b><i class="road__end"></i></div>
        <div class="road__ends">
          <p><b data-t="road.start.k"></b><span data-t="road.start"></span></p>
          <p><b data-t="road.end.k"></b><span data-t="road.end"></span></p>
        </div>
        <p class="road__line"><span id="road-line" role="status"></span> <span data-t="road.need"></span></p>
        <div class="row" style="--gap:22px"><a class="more" href="#chain-v6" data-t="comm.vote.cta"></a><a class="more" href="#node-core" data-t="node.cta"></a></div>
      </div>
    </div>
  </section>

  <section class="band" id="do">
    <div class="wrap">
      <p class="say say--wide t-xl lit" data-lit data-t="comm.do.h"></p>
      <div class="pts" style="margin-top:clamp(48px,7vw,96px)">
        <div class="pt" data-rise><h3 data-t="com.do.1.h"></h3><p data-t="com.do.1.p"></p><a class="more" href="#node" data-t="way.node.cta"></a></div>
        <div class="pt" data-rise data-delay="80"><h3 data-t="com.do.2.h"></h3><p data-t="com.do.2.p"></p><a class="more" href="#mine" data-t="way.mine.cta"></a></div>
        <div class="pt" data-rise><h3 data-t="com.do.3.h"></h3><p data-t="com.do.3.p"></p></div>
        <div class="pt" data-rise data-delay="80"><h3 data-t="com.do.4.h"></h3><p data-t="com.do.4.p"></p></div>
        <div class="pt" data-rise><h3 data-t="com.do.5.h"></h3><p data-t="com.do.5.p"></p></div>
      </div>
    </div>
  </section>

  <section class="band" id="lab">
    <div class="wrap">
      <div class="band__head"><h2 class="t-l" data-rise data-t="comm.lab.h"></h2><p class="lead" data-rise data-delay="80" data-t="com.lab.p"></p></div>
      <ol class="labpath" data-path>
        <li><b data-t="com.lab.s1"></b><span data-t="com.lab.s1.d"></span></li>
        <li><b data-t="com.lab.s2"></b><span data-t="com.lab.s2.d"></span></li>
        <li><b data-t="com.lab.s3"></b><span data-t="com.lab.s3.d"></span></li>
        <li><b data-t="com.lab.s4"></b><span data-t="com.lab.s4.d"></span></li>
        <li><b data-t="com.lab.s5"></b><span data-t="com.lab.s5.d"></span></li>
        <li><b data-t="com.lab.s6"></b><span data-t="com.lab.s6.d"></span></li>
      </ol>
      <p class="labwho"><span data-t="com.lab.k1"></span><span data-t="com.lab.k2"></span></p>
      <div class="row" style="margin-top:22px"><a class="btn btn--ghost" href="https://lab.yskar.app" target="_blank" rel="noopener"><span data-t="com.lab.open"></span><svg class="i-out" aria-hidden="true"><use href="#i-out"/></svg></a></div>
    </div>
  </section>

  <section class="band" id="safe">
    <div class="wrap">
      <div class="band__head"><h2 class="t-l" data-rise data-t="comm.safe.h"></h2></div>
      <div class="pts pts--3">
        <div class="pt" data-rise><h3 data-t="com.safe.1.h"></h3><p data-t="com.safe.1.p"></p></div>
        <div class="pt" data-rise data-delay="80"><h3 data-t="com.safe.2.h"></h3><p data-t="com.safe.2.p"></p></div>
        <div class="pt" data-rise data-delay="160"><h3 data-t="com.safe.3.h"></h3><p data-t="com.safe.3.p"></p></div>
      </div>
    </div>
  </section>
  <!--@include dawn-->
</div>
