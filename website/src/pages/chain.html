<div class="page" data-page="chain">
  <section class="pp">
    <div class="wrap pp__in">
      <h1 class="t-xl" data-t="chain.h1"></h1>
      <p class="lead" data-t="chain.lead"></p>
    </div>
  </section>

  <section class="story story--forge" id="forge">
    <div class="story__sticky">
      <div class="story__stage"><canvas role="img" data-ta="aria-label:forge.alt"></canvas></div>
      <div class="story__caps wrap">
        <div class="story__cap"><p class="story__k" data-t="chain.how.h"></p><h2 class="t-l" data-t="home.how.1.h"></h2><p class="lead" data-t="home.how.1.p"></p></div>
        <div class="story__cap"><h2 class="t-l" data-t="home.how.2.h"></h2><p class="lead" data-t="home.how.2.p"></p></div>
        <div class="story__cap"><h2 class="t-l" data-t="home.how.3.h"></h2><p class="lead" data-t="home.how.3.p"></p></div>
      </div>
    </div>
  </section>

  <section class="band">
    <div class="wrap">
      <div class="band__head"><h2 class="t-l" data-rise data-t="chain.why.h"></h2></div>
      <div class="pts pts--3">
        <div class="pt" data-rise><h3 data-t="chain.y1.h"></h3><p data-t="chain.y1.p"></p></div>
        <div class="pt" data-rise data-delay="80"><h3 data-t="chain.y2.h"></h3><p data-t="chain.y2.p"></p></div>
        <div class="pt" data-rise data-delay="160"><h3 data-t="chain.y3.h"></h3><p data-t="chain.y3.p"></p></div>
      </div>
    </div>
  </section>

  <div class="wrap toolhead">
    <h2 class="t-l" data-t="chain.deep.h"></h2>
    <p class="lead" data-t="chain.deep.p"></p>
  </div>
  <div class="t1">
    <!--@include chain-header-->
    <!--@include chain-pow-->
    <!--@include chain-difficulty-->
    <!--@include chain-accounts-->
    <!--@include chain-nodes-->
    <!--@include chain-revisions-->
    <!--@include chain-v6-->
    <!--@include chain-limits-->
  </div>
  <!--@include dawn-->
</div>
