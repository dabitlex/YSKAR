<div class="page" data-page="build">
  <section class="pp">
    <div class="wrap duo duo--mid bldx">
      <div class="pp__in">
        <h1 class="t-xl" data-t="bld.h1"></h1>
        <p class="lead" data-t="bld.lead"></p>
        <div class="row ph__cta">
          <a class="btn" href="#build-api" data-t="bld.cta"></a>
          <a class="more" href="https://github.com/dabitlex/YSKAR" target="_blank" rel="noopener"><span data-t="bld.cta2"></span><svg class="i-out" aria-hidden="true"><use href="#i-out"/></svg></a>
        </div>
      </div>
      <div class="bldx__term">
        <div class="term term--out" id="term-box" role="group" data-ta="aria-label:term.alt"><pre id="term-out"></pre></div>
        <div class="bldx__foot">
          <button type="button" class="more" id="term-more" aria-expanded="false" aria-controls="term-out" hidden></button>
          <p class="micro faint" id="term-note"></p>
        </div>
      </div>
    </div>
  </section>
  <section class="band band--tight">
    <div class="wrap">
      <div class="pts pts--3">
        <div class="pt" data-rise><h3 data-t="bld.1.h"></h3><p data-t="bld.1.p"></p></div>
        <div class="pt" data-rise data-delay="80"><h3 data-t="bld.2.h"></h3><p data-t="bld.2.p"></p></div>
        <div class="pt" data-rise data-delay="160"><h3 data-t="bld.3.h"></h3><p data-t="bld.3.p"></p><a class="more" href="https://lab.yskar.app" target="_blank" rel="noopener"><span data-t="home.people.cta2"></span><svg class="i-out" aria-hidden="true"><use href="#i-out"/></svg></a></div>
      </div>
    </div>
  </section>
