<div class="page" data-page="wallet">
  <section class="ph">
    <div class="ph__media"><img data-img="wallet-desk" data-ta="alt:way.wallet.alt" alt=""></div>
    <div class="ph__txt wrap">
      <p class="ph__k">YSKAR Wallet</p>
      <h1 class="t-xl" data-t="wal.h1"></h1>
      <p class="lead" data-t="wal.lead"></p>
      <div class="row ph__cta">
        <a class="btn" href="https://github.com/dabitlex/YSKAR--WALLET/releases/latest" target="_blank" rel="noopener"><span data-t="wallet.dl"></span><svg class="i-out" aria-hidden="true"><use href="#i-out"/></svg></a>
        <a class="more" href="#wallet-install" data-t="wal.cta2"></a>
      </div>
      <p class="ph__meta"><span data-t="wallet.meta"></span> <span data-t="ui.sample"></span></p>
    </div>
  </section>

  <section class="story story--phone" id="screens">
    <div class="story__sticky">
      <div class="story__stage">
        <div class="phone" role="img" data-ta="aria-label:wal.phone.alt">
          <img data-img="wshot1" data-lazy alt="">
          <img data-img="wshot2" data-lazy alt="">
          <img data-img="wshot3" data-lazy alt="">
          <img data-img="wshot4" data-lazy alt="">
          <img data-img="wshot5" data-lazy alt="">
          <img data-img="wshot6" data-lazy alt="">
        </div>
      </div>
      <div class="story__caps wrap">
        <div class="story__cap"><h2 class="t-l" data-t="wal.s1.h"></h2><p class="lead" data-t="wallet.feat.p"></p></div>
        <div class="story__cap"><h2 class="t-l" data-t="wallet.f2.h"></h2><p class="lead" data-t="wallet.f2.p"></p></div>
        <div class="story__cap"><h2 class="t-l" data-t="wal.s3.h"></h2><p class="lead" data-t="wal.s3.p"></p></div>
        <div class="story__cap"><h2 class="t-l" data-t="wallet.f3.h"></h2><p class="lead" data-t="wallet.f3.p"></p></div>
        <div class="story__cap"><h2 class="t-l" data-t="wal.s5.h"></h2><p class="lead" data-t="wal.s5.p"></p></div>
        <div class="story__cap"><h2 class="t-l" data-t="wallet.f6.h"></h2><p class="lead" data-t="wallet.f6.p"></p></div>
      </div>
    </div>
  </section>

  <section class="band" id="backup">
    <div class="wrap duo duo--mid">
      <p class="say t-xl lit" data-lit data-t="wal.say"></p>
      <ol class="words" id="words" data-rise aria-hidden="true"></ol>
    </div>
  </section>

  <section class="band band--tight">
    <div class="wrap">
      <div class="pts">
        <div class="pt" data-rise><h3 data-t="wallet.f1.h"></h3><p data-t="wallet.f1.p"></p></div>
        <div class="pt" data-rise data-delay="80"><h3 data-t="wallet.f5.h"></h3><p data-t="wallet.f5.p"></p></div>
      </div>
    </div>
  </section>

  <section class="band" id="install">
    <div class="wrap duo">
      <div class="duo__a">
        <h2 class="t-l" data-rise data-t="wallet.inst.h"></h2>
        <p class="lead" data-rise data-delay="80" data-t="wallet.inst.p"></p>
        <a class="btn" href="https://github.com/dabitlex/YSKAR--WALLET/releases/latest" target="_blank" rel="noopener" data-rise data-delay="140"><span data-t="wallet.dl"></span><svg class="i-out" aria-hidden="true"><use href="#i-out"/></svg></a>
      </div>
      <div class="stack" style="--gap:36px">
        <ol class="steps">
          <li data-rise><div><p data-t="wallet.inst.1"></p></div></li>
          <li data-rise><div><p data-t="wallet.inst.2"></p></div></li>
          <li data-rise><div><p data-t="wallet.inst.3"></p></div></li>
          <li data-rise><div><p data-t="wallet.inst.4"></p></div></li>
        </ol>
        <div class="stack" style="--gap:12px" data-rise>
          <h3 class="t-s" data-t="wallet.verify.h"></h3>
          <p class="dim" data-t="wallet.verify.p"></p>
          <div class="term term--fp term--pad"><code id="code-fp">00:58:4F:99:42:4A:20:F5:AF:82:7B:8C:EE:47:B5:85:8D:10:47:60:80:EF:4D:3C:CA:D7:57:4A:87:B3:05:5F</code>
            <button type="button" class="term__copy" data-copy="#code-fp" data-t="ui.copy"></button></div>
        </div>
      </div>
    </div>
  </section>

  <section class="band" id="status">
    <div class="wrap">
      <div class="band__head"><h2 class="t-l" data-rise data-t="wallet.st.h"></h2></div>
      <div class="pts">
        <div class="pt" data-rise><h3 data-t="wallet.st.1.h"></h3><p data-t="wallet.st.1.p"></p></div>
        <div class="pt" data-rise data-delay="80"><h3 data-t="wallet.st.2.h"></h3><p data-t="wallet.st.2.p"></p></div>
        <div class="pt" data-rise><h3 data-t="wallet.st.3.h"></h3><p data-t="wallet.st.3.p"></p></div>
        <div class="pt" data-rise data-delay="80"><h3 data-t="wallet.st.4.h"></h3><p data-t="wallet.st.4.p"></p></div>
      </div>
    </div>
  </section>

  <section class="band" id="others">
    <div class="wrap">
      <div class="band__head"><h2 class="t-l" data-rise data-t="wallet.oth.h"></h2><p class="lead" data-rise data-delay="80" data-t="wallet.oth.p"></p></div>
      <div class="pts">
        <div class="pt" data-rise><h3 data-t="wallet.oth.1.h"></h3><p data-t="wallet.oth.1.p"></p></div>
        <div class="pt" data-rise data-delay="80"><h3 data-t="wallet.oth.2.h"></h3><p data-t="wallet.oth.2.p"></p></div>
        <div class="pt" data-rise><h3 data-t="wallet.oth.3.h"></h3><p data-t="wallet.oth.3.p"></p></div>
        <div class="pt" data-rise data-delay="80"><h3 data-t="wallet.oth.4.h"></h3><p data-t="wallet.oth.4.p"></p></div>
      </div>
    </div>
  </section>
  <!--@include dawn-->
</div>
