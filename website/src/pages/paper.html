<div class="page" data-page="paper">
  <section class="pp pp--doc pp--paper">
    <div class="wrap pp__in">
      <p class="ph__k" data-t="foot.whitepaper"></p>
      <h1 class="t-mega">YSKAR</h1>
      <p class="lead" data-t="lv.wpseite.untertitel"></p>
      <p class="paper-note" data-paper-note hidden data-t="lv.wpseite.nurDeEn"></p>
      <div class="row paper-tools">
        <div class="seg" role="group" data-ta="aria-label:nav.lang" data-paper-pick hidden>
          <button type="button" data-paper="en" aria-pressed="true" lang="en">English</button>
          <button type="button" data-paper="de" aria-pressed="false" lang="de">Deutsch</button>
        </div>
        <span data-print hidden><button type="button" class="btn btn--ghost btn--s" data-t="lv.wpseite.drucken"></button></span>
      </div>
    </div>
  </section>
  <div class="wrap doc" data-doc="paper">
    <nav class="doc__toc" data-ta="aria-label:lv.wpseite.toc"><details><summary data-t="doc.toc"></summary><div class="doc__links"></div></details></nav>
    <div class="doc__text lv lv--paper">
      <!--@include doc-paper-->
    </div>
  </div>
  <!--@include dawn-->
</div>
