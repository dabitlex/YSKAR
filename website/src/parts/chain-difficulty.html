<section class="sec ruled" id="difficulty" aria-labelledby="tech-diff-h">
    <div class="wrap split">
      <div class="split-head">
        <h2 id="tech-diff-h" data-t="tech.diff.h"></h2>
        <p class="muted" data-t="tech.diff.p1"></p>
        <p class="muted" data-t="tech.diff.p2"></p>
      </div>
      <div class="stack" style="--gap:28px">
        <div class="display">
          <div class="display-head">
            <span class="display-title" data-t="tech.diff.chart"></span>
            <span class="state fixed" data-live="histState"></span>
          </div>
          <div class="chart" id="chart-difficulty"></div>
          <p class="fig-cap" data-t="tech.diff.cap"></p>
          <details class="chart-table"><summary data-t="chart.asTable"></summary><div id="table-difficulty"></div></details>
        </div>
        <dl class="facts">
          <div><dt data-t="tech.diff.f1"></dt><dd data-t="tech.diff.f1.v"></dd></div>
          <div><dt data-t="tech.diff.f2"></dt><dd data-t="tech.diff.f2.v"></dd></div>
          <div><dt data-t="tech.diff.f3"></dt><dd data-t="tech.diff.f3.v"></dd></div>
          <div><dt data-t="tech.diff.f4"></dt><dd data-t="tech.diff.f4.v"></dd></div>
          <div><dt data-t="tech.diff.f5"></dt><dd data-t="tech.diff.f5.v"></dd></div>
        </dl>
      </div>
    </div>
  </section>
