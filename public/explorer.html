  const status=t.status==='pending'?T.wartetAufBlock:T.inBlock(nf(t.height));

  fensterZeigen(kennung,kopfHtml(T.transaktion+' ',{
      badge:`<span class="badge offen">${status}</span>`,
      unter:`<span class="wert"><span class="mono">${lang(t.txid)}</span>${kopKnopf(t.txid)}</span>`})+`
    <div class="fs">
      <div class="fuellkasten">
        <div class="ut" style="margin:0">${T.betrag}</div>
        <div class="grosszahl">${ysr(t.amount)}<em>${sym}</em></div>
      </div>
      <div class="fakten">
        ${fakt(T.art,cb?T.blockreward:T.ueberweisung,cb&&empf.length?T.empfaenger(empf.length):'')}
        ${fakt(T.status,status,t.timestamp?uhr(t.timestamp):'')}
        ${fakt(T.gebuehr,ysr(t.fee||0)+' '+sym,'')}
      </div>
      ${(t.from||t.to||memo)?`<div class="ut">${T.kennungen}</div>`:''}
      ${adr(T.von,t.from)}${adr(T.an,t.to)}
      ${memo?`<div class="hz"><span>${T.notiz}</span><span class="wert"><span>${esc(memo)}</span></span></div>`:''}
      ${empf.length?`<div class="ut">${T.empfaenger(empf.length)}</div>
        <div class="empf-liste" style="margin-left:0">${empf.map(e=>`<div>
          ${e.address?`<a class="mono" href="#adr-${esc(e.address)}">${esc(e.address)}</a>`:'<span class="mono">—</span>'}
          <span class="mono tnum">${ysr(e.amount)} ${sym}</span></div>`).join('')}</div>`:''}
      ${Number.isInteger(Number(t.height))&&t.height!=null?`<div class="ff"><a class="haupt" href="#block-${Number(t.height)}">${T.zuBlock(nf(t.height))}</a></div>`:''}
    </div>`);
}

// -- Bedienung des Fensters
$('fenster').addEventListener('click',e=>{ if(e.target===$('fenster')) schliesseFenster(); });
document.addEventListener('keydown',e=>{
  if($('fenster').hidden) return;
  if(e.key==='Escape'){ schliesseFenster(); return; }
  if(ansicht&&ansicht.art==='block'&&!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName||'')){
    if(e.key==='ArrowLeft'&&ansicht.h>0) location.hash='#block-'+(ansicht.h-1);
    if(e.key==='ArrowRight') location.hash=(blocks[0]&&ansicht.h>=blocks[0].height)?'#neu':'#block-'+(ansicht.h+1);
  }
});
// Kopieren. Ohne sicheren Kontext (Datei von der Festplatte) gibt es
// navigator.clipboard nicht -- dann ueber ein unsichtbares Textfeld.
document.addEventListener('click',async e=>{
  const k=e.target.closest&&e.target.closest('[data-kopie]');
  if(!k) return;
  e.preventDefault();
  const text=k.dataset.kopie;
  let ok=false;
  try{ await navigator.clipboard.writeText(text); ok=true; }
  catch{
    try{
      const f=document.createElement('textarea');
      f.value=text; f.setAttribute('readonly',''); f.style.cssText='position:fixed;opacity:0;top:0;left:0';
      document.body.appendChild(f); f.select(); ok=document.execCommand('copy'); f.remove();
    }catch{ ok=false; }
  }
  if(!ok) return;
  k.classList.add('ja'); k.innerHTML=IC.ok; k.title=T.kopiert;
  setTimeout(()=>{ k.classList.remove('ja'); k.innerHTML=IC.kopie; k.title=T.kopieren; },1400);
});
// Am Handy ist das Fenster ein Blatt von unten: am Griff nach unten ziehen
// schliesst es.
(function(){
  const k=$('fenster').querySelector('.fenster');
  let y0=null, dy=0;
  k.addEventListener('touchstart',e=>{
    if(!window.matchMedia('(max-width:640px)').matches||k.scrollTop>0) return;
    if(!e.target.closest('.griff,.fk')||e.target.closest('a,button')) return;
    y0=e.touches[0].clientY; dy=0; k.style.transition='none';
  },{passive:true});
  k.addEventListener('touchmove',e=>{
    if(y0===null) return;
    dy=Math.max(0,e.touches[0].clientY-y0);
    k.style.transform=`translateY(${dy}px)`;
  },{passive:true});
  const ende=()=>{
    if(y0===null) return;
    y0=null;
    k.style.transition='transform .18s ease-out';
    if(dy>90){
      k.style.transform='translateY(100%)';
      setTimeout(()=>{ k.style.transform=''; k.style.transition=''; schliesseFenster(); },170);
    }else{
      k.style.transform='';
      setTimeout(()=>{ k.style.transition=''; },200);
    }
  };
  k.addEventListener('touchend',ende);
  k.addEventListener('touchcancel',ende);
})();

// ---------------------------------------------------------------- Laden
async function pruefeAlle(){
  for(let i=0;i<blocks.length;i++){
    checks[blocks[i].height]=await verify(blocks[i],blocks[i+1]);
  }
}

async function load(){
  try{
    const [s,b]=await Promise.all([holen('/summary'),holen('/blocks?limit='+(N_STAT+1))]);
    if(s.error||b.error) throw new Error(s.detail||b.detail||s.error||b.error);
    sum=summeAus(s); blocks=bloeckeAus(b); $('err').textContent='';
    await pruefeAlle();
    renderStats(); renderVerdict(); renderKette();
  }catch(e){
    $('err').textContent=T.ladenFehl+e.message;
  }
}

/*
  Aeltere Bloecke nachladen.

  Der bisher aelteste wird dabei NOCHMALS geprueft -- erst mit seinem
  Vorgaenger laesst sich seine Verkettung pruefen. Ohne das bliebe an jeder
  Nachladegrenze eine Luecke in der Kontrolle.
*/
let laedt=false;
async function mehrLaden(){
  if(laedt||blocks.length===0)return;
  laedt=true;
  const knopf=$('mehr');
  if(knopf){ knopf.disabled=true; knopf.textContent=T.laedtKurz; }
  try{
    const aeltester=blocks[blocks.length-1].height;
    const r=await holen(`/blocks?limit=20&before=${aeltester}`);
    if(r.error) throw new Error(r.detail||r.error);
    const neu=bloeckeAus(r).filter(b=>b.height<aeltester);
    if(neu.length){
      const vorher=blocks.length;
      blocks=blocks.concat(neu);
      for(let i=vorher-1;i<blocks.length;i++){
        checks[blocks[i].height]=await verify(blocks[i],blocks[i+1]);
      }
    }
    $('err').textContent='';
  }catch(e){
    $('err').textContent=T.nachladenFehl+e.message;
  }finally{
    laedt=false;
    $('kette').__html=null;       // der Knopf soll auf jeden Fall zurueckkommen
    renderVerdict(); renderKette();
  }
}

// ---------------------------------------------------------------- Suche
/*
  Die Route sagt nur, WAS gefunden wurde. Der Explorer springt dann zum
  passenden Anker; die Einzelheiten holt das Fenster bei der zustaendigen
  Route -- so gibt es die Aufbereitung nur einmal.
*/
async function suchen(){
  const q=$('q').value.trim();
  const ziel=$('treffer');
  ziel.className='meldung';
  if(!q){ ziel.textContent=''; return; }
  ziel.textContent=T.sucheLaeuft;
  try{
    const r=await holen('/search?q='+encodeURIComponent(q));
    let anker=null;
    if(r.kind==='block') anker='#block-'+Number(r.height);
    else if(r.kind==='address') anker='#adr-'+r.address;
    else if(r.kind==='tx') anker='#tx-'+r.txid;
    if(!anker){
      const codes={bad_address:T.sBadAddress,bad_height:T.sBadHeight,no_hash:T.sNoHash,empty:T.sEmpty};
      ziel.textContent=r.code==='no_block'?T.sNoBlock(nf(r.height??q)):(codes[r.code]||T.nichtsGefunden);
      return;
    }
    ziel.textContent=''; $('q').value=''; $('q').blur();
    if(location.hash===anker) ausHash(); else location.hash=anker;
  }catch(e){
    ziel.className='meldung schlecht';
    ziel.textContent=T.sucheFehl+e.message;
  }
}

// ----------------------------------------------------------- Navigation
/*
  Die Adresszeile fuehrt. So laesst sich alles verlinken, und der
  Zurueck-Knopf des Browsers tut, was man erwartet.

    #block-3013   ein Block
    #neu          der Block im Bau
    #adr-ysr1…    eine Adresse
    #tx-…         eine Transaktion
*/
function ausHash(){
  let h=location.hash||'';
  try{ h=decodeURIComponent(h); }catch{ /* dann eben roh */ }
  let m;
  if((m=h.match(/^#block-(\d{1,9})$/))) return zeigeBlock(Number(m[1]));
  if(h==='#neu') return zeigeBau();
  if((m=h.match(/^#adr-(ysr1[0-9a-z]{6,120})$/i))) return zeigeAdresse(m[1].toLowerCase());
  if((m=h.match(/^#tx-([0-9a-f]{64})$/i))) return zeigeTx(m[1].toLowerCase());
  if(ansicht!==null){ ansicht=null; renderKette(); }
  fensterZu();
}

$('qgo').addEventListener('click',suchen);
$('q').addEventListener('keydown',e=>{ if(e.key==='Enter') suchen(); });
window.addEventListener('hashchange',ausHash);

$('engine').textContent=useSubtle?'crypto.subtle':'SHA-256 in JavaScript';

document.documentElement.lang=L;
statischeTexte();
load().then(ausHash);

/*
  Live nachfuehren.

  Nicht neu laden, sondern NACHTRAGEN: Nur die Bloecke, die seit dem letzten
  Blick dazugekommen sind, werden geholt und vorn angehaengt.

  Der Unterschied ist wesentlich. Ein vollstaendiges Neuladen wuerde alles
  wegwerfen, was ueber "Aeltere laden" dazugekommen ist -- und die Animation
  haette nichts, woran sie ansetzen koennte, weil jeder Block als neu
  erschiene.

  Faellt der Server aus, passiert nichts: Der naechste Takt versucht es
  wieder, und die Seite bleibt stehen statt zu leeren.
*/
let laeuftAuffrischen=false;

async function auffrischen(){
  if(laeuftAuffrischen) return;
  // Ein Tab, den niemand ansieht, fragt nicht nach. Der Takt laeuft im
  // Hintergrund weiter (gedrosselt), die Arbeit soll er sich sparen.
  if(document.hidden) return;
  laeuftAuffrischen=true;
  try{
    const roh=await holen('/summary');
    if(roh.error) return;
    const s=summeAus(roh);
    const alteHoehe=sum?.height ?? null;
    sum=s;
    renderStats();
    if(ansicht&&ansicht.art==='bau') zeigeBau();

    if(blocks.length===0){ await load(); return; }
    if(s.height==null || alteHoehe===null || s.height<=alteHoehe){
      // Nichts Neues -- aber die Altersangaben ("vor 3 Min") stimmen sonst
      // nicht mehr.
      renderKette();
      return;
    }

    /*
      Wie viele fehlen? Bei einem langen Aussetzer koennen es mehrere sein.
      Mehr als zwoelf auf einmal waeren eine Nachladeschleife wert -- dann
      ist aber ohnehin etwas anderes im Argen, und ein vollstaendiges Laden
      ist ehrlicher als eine halbe Reihe.
    */
    const fehlend=s.height-alteHoehe;
    if(fehlend>12){ await load(); return; }

    const r=await holen(`/blocks?limit=${fehlend}`);
    if(r.error) return;

    // Nur wirklich neue, in der richtigen Reihenfolge (neueste zuerst) --
    // und nur, wenn sie lueckenlos an die Reihe anschliessen. blocks muss
    // eine zusammenhaengende Kette bleiben, sonst prueft die Verkettung
    // gegen den falschen Vorgaenger.
    const spitze=blocks[0].height;
    const neue=bloeckeAus(r).filter(b=>b.height>spitze).sort((a,b)=>b.height-a.height);
    if(neue.length===0) return;
    if(neue[neue.length-1].height!==spitze+1){ await load(); return; }

    blocks=neue.concat(blocks);
    for(const b of neue) delete neben[b.height];

    /*
      Die neuen pruefen -- und den bisher juengsten NOCHMALS: Erst mit
      seinem Nachfolger laesst sich pruefen, ob die Kette an dieser Stelle
      schliesst. Ohne das bliebe an jeder Naht eine Luecke in der Kontrolle.
    */
    for(let i=0;i<=neue.length;i++){
      if(blocks[i]) checks[blocks[i].height]=await verify(blocks[i],blocks[i+1]);
    }

    frisch=new Set(neue.map(b=>b.height));
    const bis=Date.now()+90_000;
    for(const b of neue) neuBis[b.height]=bis;
    renderStats(); renderVerdict(); renderKette();
    // Nach der Animation das Kennzeichen wieder loeschen, sonst liefe sie
    // beim naechsten Zeichnen erneut.
    setTimeout(()=>{ frisch=new Set(); },1600);

    // Ein geoeffneter Block bleibt offen. Nur sein "naechster Block" zeigt
    // jetzt auf einen gefundenen statt auf den im Bau.
    if(ansicht&&ansicht.art==='block'&&blockVon(ansicht.h)) zeichneBlock(blockVon(ansicht.h));
  }catch{
    /* Netzaussetzer: beim naechsten Takt wieder. Die Seite bleibt stehen. */
  }finally{
    laeuftAuffrischen=false;
  }
}

/*
  Alle fuenf Sekunden. Bei einer Zielblockzeit von zehn Minuten ist das
  reichlich -- aber ein Nutzer, der gerade zusieht, soll den Block sehen,
  wenn er faellt, nicht eine halbe Minute spaeter.

  /summary ist eine einzelne Zeile aus der Datenbank; Bloecke werden nur
  geholt, wenn die Hoehe gestiegen ist.
*/
setInterval(auffrischen,5000);

/*
  Im Hintergrund nicht pollen.

  Ein Browser-Tab, den niemand ansieht, muss den Server nicht fragen. Beim
  Zurueckkommen sofort einmal nachziehen -- sonst staende dort ein veralteter
  Stand, bis der naechste Takt kommt.
*/
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible') auffrischen();
});
</script>
