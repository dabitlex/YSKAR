name: Node Core bauen und veröffentlichen

# Baut den YSKAR Node Core für Windows (Installer) und Linux (.deb, AppImage).
#
#   Zweig node-core-release  Tests, GPU-Miner, beide Fassungen -- und ein
#                            ENTWURF einer Veröffentlichung, an dem die Dateien
#                            für Windows UND Linux getrennt hängen. Der Nutzer
#                            lädt die Datei für sein System.
#                            Wer diesen Zweig auf einen Stand setzt, bekommt
#                            den Entwurf für die Version aus package.json.
#   von Hand, mit Haken      dasselbe, vom gewählten Zweig aus.
#   Arbeitszweig / von Hand  dasselbe ohne Veröffentlichung; der Installer
#                            hängt als Artefakt am Lauf.
#
# Veröffentlicht wird der Entwurf von Hand auf der Seite "Releases" -- erst
# dann ist er sichtbar, und erst dann legt GitHub den Tag node-core-vX.Y.Z an,
# auf genau dem Stand, aus dem gebaut wurde. Nach diesen Tags sucht das
# Programm, wenn es nach einer neuen Version sieht (node-core/src/Programm.ts).
#
# Einen Tag von Hand zu setzen löst nichts aus. Eine Version, die schon
# veröffentlicht ist, wird nicht noch einmal gebaut: Der Installer an einer
# Veröffentlichung ändert sich nie. Für einen neuen Installer zählt die
# Versionsnummer hoch.
#
# Was hier geprüft wird und was nicht:
#   - Die Tests laufen auf Linux gegen die echte Anwendungsklasse.
#   - Die fertigen Pakete werden nicht installiert. Gestartet wird jeweils
#     das ausgepackte Programm (Linux: unter einem virtuellen Bildschirm): Es
#     muss seine Oberfläche ausliefern, die Hülle muss sich anmelden, ein
#     zweiter Start darf kein zweites Programm ergeben, und es muss sich
#     wieder beenden.
#   - Eine Grafikkarte gibt es hier nicht. Dass der GPU-Miner RECHNET, kann
#     nur ein PC mit NVIDIA-Karte zeigen. Für Linux wird der GPU-Miner im
#     Container nvidia/cuda (CUDA 12.8) gebaut (Issue #9); er liegt in den
#     Linux-Paketen und zusätzlich als einzelne Datei an der Veröffentlichung,
#     etwa für Mining-Systeme wie HiveOS.
#   - Ein Entwurf entsteht nur, wenn BEIDE Fassungen gebaut sind.

on:
  push:
    branches: ['node-core-release', 'node-core-voll']
  workflow_dispatch:
    inputs:
      entwurf:
        description: 'Entwurf einer Veröffentlichung anlegen'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: node-core-${{ github.ref }}
  cancel-in-progress: true

env:
  # 'true', wenn dieser Lauf einen Entwurf einer Veröffentlichung anlegt.
  RELEASE: ${{ github.ref == 'refs/heads/node-core-release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.entwurf == 'true') }}

jobs:
  pruefen:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Vor allem anderen: Gehört der Text zur Version, und ist sie noch frei?
      - name: Darf diese Version veröffentlicht werden?
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v=$(node -p "require('./node-core/package.json').version")
          if ! grep -qF "YSKAR Node Core $v" node-core/RELEASE_NOTES.md; then
            echo "::error::node-core/RELEASE_NOTES.md beschreibt nicht die Version $v."; exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/node-core-v$v")
          case "$code" in
            404) echo "::notice title=Version::Node Core $v ist noch nicht veröffentlicht -- der Entwurf wird angelegt." ;;
            200) echo "::error::Node Core $v ist schon veröffentlicht. Für einen neuen Installer die Versionsnummer hochzählen."; exit 1 ;;
            *)   echo "::error::Ob Node Core $v schon veröffentlicht ist, ließ sich nicht prüfen (HTTP $code)."; exit 1 ;;
          esac

      - name: Abhängigkeiten
        run: npm ci

      - name: Typen prüfen
        run: npx tsc -p node-core/tsconfig.json --noEmit

      - name: GPU-Nachbildung bauen
        working-directory: node-core
        run: mkdir -p gpu/bin && npm run build:gpu-emu

      - name: Tests des Node Core
        working-directory: node-core
        run: node --experimental-strip-types --no-warnings --test test/*.test.ts

      - name: Tests der Mining-Schnittstelle
        run: node --experimental-strip-types --no-warnings --test tests/miningserver-haertung.test.ts tests/miningserver.test.ts tests/pool-server.test.ts tests/pool-plaetze.test.ts tests/netz-statistik.test.ts

  gpu:
    name: GPU-Miner (CUDA)
    runs-on: windows-2022
    # Auf dem Arbeitszweig darf dieser Teil scheitern -- der Installer entsteht
    # dann ohne GPU-Miner. Eine Veröffentlichung braucht ihn.
    continue-on-error: ${{ !(github.ref == 'refs/heads/node-core-release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.entwurf == 'true')) }}
    outputs:
      gebaut: ${{ steps.fertig.outputs.gebaut }}
    steps:
      - uses: actions/checkout@v4

      # Nur was der Bau braucht: Compiler und Laufzeit. Kein Treiber, keine
      # Bibliotheken -- das Programm wird statisch gegen die Laufzeit gelinkt.
      - name: CUDA Toolkit 11.8 (nvcc, Laufzeit)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://developer.download.nvidia.com/compute/cuda/11.8.0/network_installers/cuda_11.8.0_windows_network.exe'
          $exe = Join-Path $env:RUNNER_TEMP 'cuda.exe'
          Invoke-WebRequest $url -OutFile $exe
          $lauf = Start-Process -FilePath $exe -ArgumentList '-s', 'nvcc_11.8', 'cudart_11.8' -Wait -PassThru
          if ($lauf.ExitCode -ne 0) { throw "Der CUDA-Installer endet mit $($lauf.ExitCode)." }
          $pfad = 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v11.8'
          if (-not (Test-Path (Join-Path $pfad 'bin\nvcc.exe'))) { throw 'nvcc.exe fehlt nach der Installation.' }
          "CUDA_PATH=$pfad" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Join-Path $pfad 'bin') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: yskar-cuda.exe bauen
        working-directory: node-core
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File gpu\build-gpu.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Der Bau des GPU-Miners ist gescheitert.' }
          if (-not (Test-Path gpu\bin\yskar-cuda.exe)) { throw 'gpu\bin\yskar-cuda.exe fehlt.' }

      # Ohne Karte kann das Programm nicht rechnen -- aber es muss starten und
      # sagen, dass es keine findet. Stürzt es hier ab, fehlt ihm etwas.
      - name: Startet das Programm?
        working-directory: node-core
        shell: pwsh
        run: |
          $aus = ''
          $ende = 'gar nicht gestartet'
          try {
            $aus = & gpu\bin\yskar-cuda.exe --probe 2>&1 | Out-String
            $ende = $LASTEXITCODE
          } catch {
            $aus = $_.Exception.Message
          }
          Write-Host $aus
          $groesse = (Get-Item gpu\bin\yskar-cuda.exe).Length
          $hash = (Get-FileHash gpu\bin\yskar-cuda.exe -Algorithm SHA256).Hash.ToLower()
          # Ohne NVIDIA-Treiber endet das Programm mit einem Fehler -- das ist hier zu erwarten.
          Write-Host "::notice title=GPU-Miner::yskar-cuda.exe gebaut ($groesse Byte, sha256 $($hash.Substring(0, 16))). --probe endet hier mit ${ende}: $($aus.Trim() -replace '\s+', ' ')"
          $global:LASTEXITCODE = 0

      - uses: actions/upload-artifact@v4
        with:
          name: yskar-cuda
          path: node-core/gpu/bin/yskar-cuda.exe
          if-no-files-found: error

      # Erst hier gilt der GPU-Miner als gebaut. (Das Ergebnis des Jobs taugt
      # dafür nicht: Darf er scheitern, meldet GitHub ihn trotzdem als gelungen.)
      - id: fertig
        shell: pwsh
        run: '"gebaut=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8'

  installer:
    name: Windows-Installer
    needs: [pruefen, gpu]
    if: ${{ always() && needs.pruefen.result == 'success' && (needs.gpu.outputs.gebaut == 'true' || !(github.ref == 'refs/heads/node-core-release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.entwurf == 'true'))) }}
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
        working-directory: node-core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node-core/package-lock.json

      - name: Version
        id: version
        run: |
          $ErrorActionPreference = 'Stop'
          $paket = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $quelle = (Select-String -Path src\main.ts -Pattern "export const VERSION = '([^']+)'").Matches[0].Groups[1].Value
          if ($quelle -ne $paket) { throw "src/main.ts sagt $quelle, package.json sagt $paket." }
          "version=$paket" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Node Core $paket"

      - name: GPU-Miner holen
        if: ${{ needs.gpu.outputs.gebaut == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: yskar-cuda
          path: node-core/gpu/bin

      - name: Abhängigkeiten
        run: npm ci

      # Der Installer nimmt den GPU-Miner aus diesem Ordner mit -- es muss ihn geben, auch leer.
      - name: Ordner für den GPU-Miner
        run: New-Item -ItemType Directory -Force gpu\bin | Out-Null

      - name: Bundle und Installer
        run: npm run dist
        env:
          # Nichts veröffentlichen -- das macht der letzte Schritt, und nur als Entwurf.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Was im Paket liegt
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem release -File | Format-Table Name, Length
          $res = 'release\win-unpacked\resources'
          Get-ChildItem $res | Format-Table Name, Length
          if (-not (Test-Path "$res\app.asar")) { throw 'app.asar fehlt.' }
          if (-not (Test-Path "$res\icon.ico")) { throw 'icon.ico fehlt neben dem Programm.' }
          $gpu = Test-Path "$res\yskar-cuda.exe"
          Write-Host "GPU-Miner im Paket: $gpu"
          if ('${{ needs.gpu.outputs.gebaut }}' -eq 'true' -and -not $gpu) { throw 'Der GPU-Miner wurde gebaut, liegt aber nicht im Paket.' }

      # Das ausgepackte Programm wirklich starten. Hier laufen die Teile, die
      # sich nirgends sonst prüfen lassen: die Hülle, das Laden aus dem
      # Programmarchiv, das Symbol, der zweite Start, das Beenden.
      - name: Probelauf des Programms
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem 'release\win-unpacked' -Filter '*.exe' | Where-Object { $_.Name -like 'YSKAR*' } | Select-Object -First 1
          if (-not $exe) { throw 'Das Programm fehlt in release\win-unpacked.' }
          # Seit 0.5.2 steht der Zugangsschluessel nicht mehr in der Seite
          # (Befund S8). Der Probelauf gibt ihn deshalb beim Start vor; das
          # Programm liest YSKAR_ZUGANG einmal und entfernt die Variable.
          $zugang = -join (1..32 | ForEach-Object { '{0:x2}' -f (Get-Random -Maximum 256) })
          $env:YSKAR_ZUGANG = $zugang
          Write-Host "Starte $($exe.FullName)"
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Remove-Item Env:YSKAR_ZUGANG

          $seite = $null
          for ($i = 0; $i -lt 90; $i++) {
            try { $seite = Invoke-WebRequest 'http://127.0.0.1:8650/' -UseBasicParsing -TimeoutSec 3; break } catch { Start-Sleep -Seconds 1 }
            if ($p.HasExited) { throw "Das Programm endet sofort wieder (Code $($p.ExitCode))." }
          }
          if (-not $seite) { throw 'Die Oberfläche antwortet nicht.' }
          if ($seite.Content.Contains($zugang)) { throw 'Die Seite enthält den Zugangsschlüssel -- das darf seit 0.5.2 nicht mehr sein.' }
          try {
            Invoke-RestMethod 'http://127.0.0.1:8650/api/status' -TimeoutSec 10 | Out-Null
            throw 'Die Schnittstelle antwortet ohne Zugangsschlüssel.'
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 401) { throw }
          }
          $kopf = @{ 'x-yskar-token' = $zugang }
          $ruf = { param($pfad, $rumpf) Invoke-RestMethod "http://127.0.0.1:8650$pfad" -Method Post -Headers $kopf -ContentType 'application/json' -Body $rumpf -TimeoutSec 30 }

          $s = Invoke-RestMethod 'http://127.0.0.1:8650/api/status' -Headers $kopf
          Write-Host "::notice title=Probelauf::Version $($s.version), Netz $($s.network), Hülle $($s.huelle | ConvertTo-Json -Compress)"
          if ($s.version -ne '${{ steps.version.outputs.version }}') { throw "Das Programm meldet Version $($s.version)." }
          if ($s.network -ne 'yskar-main-1') { throw "Das Programm läuft nicht auf dem Mainnet: $($s.network)" }
          if (-not $s.huelle.vorhanden) { throw 'Die Hülle hat sich nicht angemeldet.' }
          Write-Host "Symbol im Infobereich: $($s.huelle.infobereich)"

          foreach ($datei in '/ui/app.css', '/ui/js/main.js', '/ui/fonts/manrope-latin-wght-normal.woff2') {
            $r = Invoke-WebRequest "http://127.0.0.1:8650$datei" -UseBasicParsing
            if ($r.StatusCode -ne 200) { throw "$datei fehlt im Paket." }
          }

          # Start mit Windows: setzen, lesen, wieder löschen.
          $an = & $ruf '/api/huelle/autostart' '{"an":true}'
          $aus = & $ruf '/api/huelle/autostart' '{"an":false}'
          Write-Host "::notice title=Start mit Windows::nach dem Einschalten $($an.autostart), nach dem Ausschalten $($aus.autostart)"
          if (-not $an.autostart) { throw 'Start mit Windows ließ sich nicht einschalten.' }
          if ($aus.autostart) { throw 'Start mit Windows ließ sich nicht ausschalten.' }

          # Der GPU-Miner: Ohne Karte findet er nichts -- aber das Programm muss ihn finden.
          $m = & $ruf '/api/mining/detect' '{}'
          Write-Host "::notice title=GPU-Erkennung::$($m.gpuErkennung | ConvertTo-Json -Compress)"
          if ((Test-Path 'release\win-unpacked\resources\yskar-cuda.exe') -and -not $m.gpuErkennung.programm) {
            throw 'Der GPU-Miner liegt im Paket, wird vom Programm aber nicht gefunden.'
          }

          # Ein zweiter Start darf kein zweites Programm ergeben.
          $p2 = Start-Process -FilePath $exe.FullName -PassThru
          if (-not $p2.WaitForExit(20000)) { Stop-Process -Id $p2.Id -Force; throw 'Ein zweiter Start bleibt als zweites Programm stehen.' }
          $s2 = Invoke-RestMethod 'http://127.0.0.1:8650/api/status' -Headers $kopf
          Write-Host "Nach dem zweiten Start läuft weiter das erste (Version $($s2.version))."

          # Beenden über die Oberfläche: Der Prozess muss wirklich enden.
          & $ruf '/api/shutdown' '{}' | Out-Null
          if (-not $p.WaitForExit(30000)) { Stop-Process -Id $p.Id -Force; throw 'Das Programm beendet sich nicht.' }
          Write-Host "::notice title=Beenden::Zweiter Start endete mit $($p2.ExitCode); das Programm beendete sich mit $($p.ExitCode)."

          $log = Join-Path $env:LOCALAPPDATA 'YSKAR\Node Core\protokoll.log'
          if (Test-Path $log) { Write-Host '--- protokoll.log'; Get-Content $log -Tail 30 }

      - name: Prüfsumme
        run: |
          $ErrorActionPreference = 'Stop'
          $datei = "release\YSKAR-Node-Core-Setup-${{ steps.version.outputs.version }}.exe"
          if (-not (Test-Path $datei)) { throw "$datei fehlt." }
          $hash = (Get-FileHash $datei -Algorithm SHA256).Hash.ToLower()
          "$hash  YSKAR-Node-Core-Setup-${{ steps.version.outputs.version }}.exe" | Out-File -FilePath "$datei.sha256" -Encoding ascii
          Write-Host "::notice title=Installer::$((Get-Item $datei).Length) Byte, SHA-256 $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: YSKAR-Node-Core-Setup-${{ steps.version.outputs.version }}
          path: |
            node-core/release/YSKAR-Node-Core-Setup-${{ steps.version.outputs.version }}.exe
            node-core/release/YSKAR-Node-Core-Setup-${{ steps.version.outputs.version }}.exe.sha256
          if-no-files-found: error

  gpu-linux:
    name: GPU-Miner Linux (CUDA)
    runs-on: ubuntu-22.04
    # Das offizielle Image von NVIDIA mit CUDA 12.8: Compiler und Laufzeit,
    # sonst wird nichts geladen. CUDA 12.8 kennt Maxwell (GTX 9xx) bis
    # Blackwell (RTX 50xx); CUDA 13 kennt Maxwell und Pascal nicht mehr.
    container: nvidia/cuda:12.8.1-devel-ubuntu20.04
    # Wie unter Windows: Auf dem Arbeitszweig darf dieser Teil scheitern --
    # die Linux-Pakete entstehen dann ohne GPU-Miner. Eine Veröffentlichung
    # braucht ihn.
    continue-on-error: ${{ !(github.ref == 'refs/heads/node-core-release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.entwurf == 'true')) }}
    outputs:
      gebaut: ${{ steps.fertig.outputs.gebaut }}
    steps:
      - uses: actions/checkout@v4

      - name: yskar-cuda bauen
        working-directory: node-core
        shell: bash
        run: bash gpu/build-gpu.sh

      # Ohne Karte kann das Programm nicht rechnen -- aber es muss starten
      # und sagen, dass es keine findet. Fehlt ihm eine Bibliothek oder
      # stürzt es ab, endet es anders.
      - name: Startet das Programm?
        working-directory: node-core
        shell: bash
        run: |
          set +e
          aus=$(gpu/bin/yskar-cuda --probe 2>&1); ende=$?
          set -e
          echo "$aus"
          case "$aus" in
            *'"t":'*) ;;
            *) echo "::error::yskar-cuda antwortet nicht wie erwartet (Code $ende)."; exit 1 ;;
          esac
          glibc=$(objdump -T gpu/bin/yskar-cuda | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "::notice title=GPU-Miner Linux::yskar-cuda gebaut ($(stat -c %s gpu/bin/yskar-cuda) Byte, sha256 $(sha256sum gpu/bin/yskar-cuda | cut -c1-16), braucht $glibc). --probe endet hier mit $ende: $(echo $aus | tr -s ' ')"

      - uses: actions/upload-artifact@v4
        with:
          name: yskar-cuda-linux
          path: node-core/gpu/bin/yskar-cuda
          if-no-files-found: error

      - id: fertig
        shell: bash
        run: echo "gebaut=true" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux-Pakete
    needs: [pruefen, gpu-linux]
    if: ${{ always() && needs.pruefen.result == 'success' && (needs.gpu-linux.outputs.gebaut == 'true' || !(github.ref == 'refs/heads/node-core-release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.entwurf == 'true'))) }}
    # 22.04: Was auf der älteren glibc gebaut ist, läuft auch auf neueren Systemen.
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
        working-directory: node-core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node-core/package-lock.json

      - name: Version
        id: version
        run: |
          set -euo pipefail
          paket=$(node -p "require('./package.json').version")
          quelle=$(sed -n "s/^export const VERSION = '\([^']*\)'.*/\1/p" src/main.ts)
          if [ "$quelle" != "$paket" ]; then echo "::error::src/main.ts sagt $quelle, package.json sagt $paket."; exit 1; fi
          echo "version=$paket" >> "$GITHUB_OUTPUT"
          echo "Node Core $paket"

      - name: GPU-Miner holen
        if: ${{ needs.gpu-linux.outputs.gebaut == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: yskar-cuda-linux
          path: node-core/gpu/bin

      # Ein Artefakt verliert das Ausführungsrecht.
      - name: GPU-Miner ausführbar machen
        if: ${{ needs.gpu-linux.outputs.gebaut == 'true' }}
        run: chmod 755 gpu/bin/yskar-cuda

      - name: Abhängigkeiten
        run: npm ci

      - name: Bundle und Pakete
        run: npm run dist:linux

      - name: Was im Paket liegt
        run: |
          set -euo pipefail
          v='${{ steps.version.outputs.version }}'
          ls -l release
          res=release/linux-unpacked/resources
          ls -l "$res"
          for f in "$res/app.asar" "$res/icon.png"; do [ -f "$f" ] || { echo "::error::$f fehlt."; exit 1; }; done
          if [ '${{ needs.gpu-linux.outputs.gebaut }}' = true ]; then
            [ -x "$res/yskar-cuda" ] || { echo "::error::Der GPU-Miner wurde gebaut, liegt aber nicht ausführbar im Paket."; exit 1; }
            dpkg-deb -c "release/YSKAR-Node-Core-$v-amd64.deb" | grep -E 'resources/yskar-cuda$'
          fi
          for f in "release/YSKAR-Node-Core-$v-amd64.deb" "release/YSKAR-Node-Core-$v-x86_64.AppImage"; do
            [ -f "$f" ] || { echo "::error::$f fehlt."; exit 1; }
          done
          dpkg-deb -I "release/YSKAR-Node-Core-$v-amd64.deb" | sed -n '/Package:/,$p'

      # Wie unter Windows: das ausgepackte Programm wirklich starten -- hier
      # unter einem virtuellen Bildschirm. --no-sandbox nur für diesen
      # Probelauf: Im ausgepackten Ordner ist chrome-sandbox nicht
      # eingerichtet; das .deb richtet es bei der Installation ein.
      - name: Probelauf des Programms
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          app=release/linux-unpacked/yskar-node-core-app
          zugang=$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')
          YSKAR_ZUGANG=$zugang xvfb-run -a "$app" --no-sandbox > "$RUNNER_TEMP/app.log" 2>&1 &
          pid=$!
          seite=''
          for i in $(seq 1 90); do
            if seite=$(curl -sf --max-time 3 http://127.0.0.1:8650/); then break; fi
            if ! kill -0 $pid 2>/dev/null; then echo "::error::Das Programm endet sofort wieder."; cat "$RUNNER_TEMP/app.log"; exit 1; fi
            sleep 1
          done
          [ -n "$seite" ] || { echo "::error::Die Oberfläche antwortet nicht."; cat "$RUNNER_TEMP/app.log"; exit 1; }
          if grep -qF "$zugang" <<<"$seite"; then echo "::error::Die Seite enthält den Zugangsschlüssel."; exit 1; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8650/api/status)
          [ "$code" = 401 ] || { echo "::error::Die Schnittstelle antwortet ohne Zugangsschlüssel mit $code."; exit 1; }

          kopf="x-yskar-token: $zugang"
          ruf() { curl -sf -X POST -H "$kopf" -H 'content-type: application/json' --data "$2" "http://127.0.0.1:8650$1"; }
          feld() { node -e "const s=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(JSON.stringify($1))"; }

          s=$(curl -sf -H "$kopf" http://127.0.0.1:8650/api/status)
          echo "::notice title=Probelauf (Linux)::$(feld '{version:s.version,network:s.network,plattform:s.plattform,huelle:s.huelle}' <<<"$s")"
          [ "$(feld 's.version' <<<"$s")" = '"${{ steps.version.outputs.version }}"' ] || { echo "::error::Falsche Version."; exit 1; }
          [ "$(feld 's.network' <<<"$s")" = '"yskar-main-1"' ] || { echo "::error::Nicht im Mainnet."; exit 1; }
          [ "$(feld 's.plattform' <<<"$s")" = '"linux"' ] || { echo "::error::Plattform nicht linux."; exit 1; }
          [ "$(feld 's.huelle.vorhanden' <<<"$s")" = true ] || { echo "::error::Die Hülle hat sich nicht angemeldet."; exit 1; }

          for d in /ui/app.css /ui/js/main.js /ui/fonts/manrope-latin-wght-normal.woff2; do
            curl -sf -o /dev/null "http://127.0.0.1:8650$d" || { echo "::error::$d fehlt im Paket."; exit 1; }
          done

          # Start beim Anmelden: setzen, lesen, wieder löschen.
          an=$(ruf /api/huelle/autostart '{"an":true}' | feld 's.autostart')
          datei="$HOME/.config/autostart/yskar-node-core.desktop"
          if [ -f "$datei" ]; then cat "$datei"; fi
          aus=$(ruf /api/huelle/autostart '{"an":false}' | feld 's.autostart')
          echo "::notice title=Start beim Anmelden::nach dem Einschalten $an, nach dem Ausschalten $aus"
          [ "$an" = true ] && [ "$aus" = false ] && [ ! -f "$datei" ] || { echo "::error::Start beim Anmelden lässt sich nicht schalten."; exit 1; }

          # Der GPU-Miner: Ohne Karte findet er nichts -- aber das Programm muss ihn finden.
          gpu=$(ruf /api/mining/detect '{}' | feld 's.gpuErkennung')
          echo "::notice title=GPU-Erkennung (Linux)::$gpu"
          if [ -x release/linux-unpacked/resources/yskar-cuda ] && [ "$(feld 's.programm' <<<"$gpu")" = null ]; then
            echo "::error::Der GPU-Miner liegt im Paket, wird vom Programm aber nicht gefunden."; exit 1
          fi

          # Ein zweiter Start darf kein zweites Programm ergeben.
          if ! timeout 20 xvfb-run -a "$app" --no-sandbox > /dev/null 2>&1; then
            echo "::error::Ein zweiter Start bleibt als zweites Programm stehen."; exit 1
          fi
          curl -sf -H "$kopf" http://127.0.0.1:8650/api/status > /dev/null

          # Beenden über die Oberfläche: Der Prozess muss wirklich enden.
          ruf /api/shutdown '{}' > /dev/null
          for i in $(seq 1 30); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then kill $pid; echo "::error::Das Programm beendet sich nicht."; exit 1; fi
          echo "Das Programm hat sich beendet."
          log="$HOME/.yskar/node-core/protokoll.log"
          if [ -f "$log" ]; then echo '--- protokoll.log'; tail -30 "$log"; fi

      # Der GPU-Miner zusätzlich als einzelne Datei -- für Mining-Systeme
      # ohne Desktop (HiveOS und ähnliche), die nur das Programm brauchen.
      - name: GPU-Miner als einzelne Datei
        if: ${{ needs.gpu-linux.outputs.gebaut == 'true' }}
        run: cp gpu/bin/yskar-cuda "release/yskar-cuda-${{ steps.version.outputs.version }}-linux-x86_64"

      - name: Prüfsummen
        run: |
          set -euo pipefail
          v='${{ steps.version.outputs.version }}'
          cd release
          dateien=("YSKAR-Node-Core-$v-amd64.deb" "YSKAR-Node-Core-$v-x86_64.AppImage")
          [ -f "yskar-cuda-$v-linux-x86_64" ] && dateien+=("yskar-cuda-$v-linux-x86_64")
          for f in "${dateien[@]}"; do
            sha256sum "$f" > "$f.sha256"
            echo "::notice title=$f::$(stat -c %s "$f") Byte, SHA-256 $(cut -d' ' -f1 "$f.sha256")"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: YSKAR-Node-Core-Linux-${{ steps.version.outputs.version }}
          path: |
            node-core/release/YSKAR-Node-Core-${{ steps.version.outputs.version }}-amd64.deb
            node-core/release/YSKAR-Node-Core-${{ steps.version.outputs.version }}-amd64.deb.sha256
            node-core/release/YSKAR-Node-Core-${{ steps.version.outputs.version }}-x86_64.AppImage
            node-core/release/YSKAR-Node-Core-${{ steps.version.outputs.version }}-x86_64.AppImage.sha256
            node-core/release/yskar-cuda-${{ steps.version.outputs.version }}-linux-x86_64
            node-core/release/yskar-cuda-${{ steps.version.outputs.version }}-linux-x86_64.sha256
          if-no-files-found: error

  entwurf:
    name: Entwurf der Veröffentlichung
    needs: [installer, linux]
    # Nur mit BEIDEN Fassungen -- eine Veröffentlichung ohne Linux- oder ohne
    # Windows-Datei gibt es nicht.
    if: ${{ needs.installer.result == 'success' && needs.linux.result == 'success' && (github.ref == 'refs/heads/node-core-release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.entwurf == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: echo "version=$(node -p "require('./node-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: YSKAR-Node-Core-Setup-${{ steps.version.outputs.version }}
          path: dateien

      - uses: actions/download-artifact@v4
        with:
          name: YSKAR-Node-Core-Linux-${{ steps.version.outputs.version }}
          path: dateien

      - name: Was angehängt wird
        run: ls -l dateien

      # Ein ENTWURF. Sichtbar wird die Veröffentlichung erst, wenn sie von
      # Hand freigegeben wird -- und erst dann findet das Programm sie auch
      # bei seiner Suche nach einer neuen Version. Den Tag gibt es bis dahin
      # nicht; GitHub legt ihn beim Freigeben auf diesem Stand an.
      - name: Entwurf der Veröffentlichung
        id: entwurf
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # "Neueste" Veröffentlichung bleibt die App -- auf sie zeigen die
          # Links zur APK. Siehe neueste-veroeffentlichung.yml.
          make_latest: 'false'
          tag_name: node-core-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: YSKAR Node Core ${{ steps.version.outputs.version }}
          generate_release_notes: false
          body_path: node-core/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dateien/YSKAR-Node-Core-Setup-${{ steps.version.outputs.version }}.exe
            dateien/YSKAR-Node-Core-Setup-${{ steps.version.outputs.version }}.exe.sha256
            dateien/YSKAR-Node-Core-${{ steps.version.outputs.version }}-amd64.deb
            dateien/YSKAR-Node-Core-${{ steps.version.outputs.version }}-amd64.deb.sha256
            dateien/YSKAR-Node-Core-${{ steps.version.outputs.version }}-x86_64.AppImage
            dateien/YSKAR-Node-Core-${{ steps.version.outputs.version }}-x86_64.AppImage.sha256
            dateien/yskar-cuda-${{ steps.version.outputs.version }}-linux-x86_64
            dateien/yskar-cuda-${{ steps.version.outputs.version }}-linux-x86_64.sha256

      - name: Wo der Entwurf liegt
        run: echo "::notice title=Entwurf::node-core-v${{ steps.version.outputs.version }} auf ${{ github.sha }} -- ${{ steps.entwurf.outputs.url }}"
